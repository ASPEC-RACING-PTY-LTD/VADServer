name: Release

# A push to main releases only when one of the pushed commit messages contains
#   DEPLOY: Production   -> next version (scripts/release-version.sh), tag vX.Y.Z,
#                           images :X.Y.Z and :latest, a normal GitHub release
#   DEPLOY: Development  -> the current production version, tag vX.Y.Z-dev,
#                           images :X.Y.Z-dev and :dev, a pre-release that is
#                           replaced on every development release
# Any other push builds nothing here (CI still runs). Images are
# linux/amd64 + linux/arm64 at ghcr.io/aspec-racing-pty-ltd/vad-server;
# install.sh always pulls :latest (or :dev with VAULTDOCK_CHANNEL=development).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel for the current main commit
        type: choice
        options: [production, development]
        required: true

# One release at a time, so two runs never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aspec-racing-pty-ltd/vad-server

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # Commit messages go through the environment, never into the script text.
      - name: Channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.channel }}
          MESSAGES: ${{ join(github.event.commits.*.message, ' | ') }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then ch=$INPUT
          elif grep -qF 'DEPLOY: Production' <<<"$MESSAGES"; then ch=production
          elif grep -qF 'DEPLOY: Development' <<<"$MESSAGES"; then ch=development
          else ch=""; fi
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          if [ -z "$ch" ]; then echo "No DEPLOY: line in the pushed commits; nothing to release." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v5
        if: steps.channel.outputs.channel != ''
        with:
          fetch-depth: 0
      - name: Version
        id: v
        if: steps.channel.outputs.channel != ''
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          bash scripts/release-version.sh "$CHANNEL" | tee -a "$GITHUB_OUTPUT"
          echo "Releasing $CHANNEL $(grep '^version=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2) from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: Server image (amd64 + arm64)
    needs: plan
    if: needs.plan.outputs.channel != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      # The SDK is vendored in ./sdk (go.mod replace), so the build needs no
      # other repository. A tag is simply moved when it is pushed again.
      - name: Image tags
        id: tags
        run: |
          if [ "$CHANNEL" = production ]; then moving=latest; else moving=dev; fi
          { echo "tags<<EOF"; echo "$IMAGE:$VERSION"; echo "$IMAGE:$moving"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build stages cross-compile natively (see Dockerfile), so arm64 needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=VaultDock server
            org.opencontainers.image.description=Self-hosted file storage and intelligent synchronisation
            org.opencontainers.image.vendor=ASPEC Racing Pty Ltd
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.source=https://github.com/ASPEC-RACING-PTY-LTD/vad-server
            org.opencontainers.image.url=https://github.com/ASPEC-RACING-PTY-LTD/vad-server
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Self-hosted file storage and intelligent synchronisation
            index:org.opencontainers.image.source=https://github.com/ASPEC-RACING-PTY-LTD/vad-server
            index:org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            index:org.opencontainers.image.version=${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
          provenance: false
      - name: Summary
        run: printf 'Pushed `%s:%s` (%s)\n' "$IMAGE" "$VERSION" "$CHANNEL" >> "$GITHUB_STEP_SUMMARY"

  # The optional smart processing worker (deploy/integrations/smart). Its
  # Python wheels are prebuilt for both platforms, so arm64 builds under
  # emulation without compiling anything.
  smart-worker-image:
    name: Smart worker image (amd64 + arm64)
    needs: plan
    if: needs.plan.outputs.channel != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      WORKER_IMAGE: ghcr.io/aspec-racing-pty-ltd/vad-smart-worker
    steps:
      - uses: actions/checkout@v5
      - name: Image tags
        id: tags
        run: |
          if [ "$CHANNEL" = production ]; then moving=latest; else moving=dev; fi
          { echo "tags<<EOF"; echo "$WORKER_IMAGE:$VERSION"; echo "$WORKER_IMAGE:$moving"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: smart-worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=VaultDock smart processing worker
            org.opencontainers.image.description=Local inference worker for VaultDock smart video processing
            org.opencontainers.image.vendor=ASPEC Racing Pty Ltd
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.source=https://github.com/ASPEC-RACING-PTY-LTD/vad-server
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Local inference worker for VaultDock smart video processing
            index:org.opencontainers.image.source=https://github.com/ASPEC-RACING-PTY-LTD/vad-server
            index:org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            index:org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=smart-worker-image
          cache-to: type=gha,scope=smart-worker-image,mode=max
          provenance: false
      - name: Summary
        run: printf 'Pushed `%s:%s` (%s)\n' "$WORKER_IMAGE" "$VERSION" "$CHANNEL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [plan, server-image, smart-worker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      # GitHub renames release assets that start with a dot, so .env.example is
      # published as env.example. deploy.tar.gz unpacks to deploy/…; it is
      # built reproducibly (sorted, fixed owner and commit timestamp).
      - name: Assets
        run: |
          mkdir -p assets
          cp install.sh docker-compose.yml assets/
          cp .env.example assets/env.example
          ts=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$ts" \
              --format=gnu -cf - deploy | gzip -n9 > assets/deploy.tar.gz
          cd assets && sha256sum -- install.sh docker-compose.yml env.example deploy.tar.gz > SHA256SUMS && cat SHA256SUMS
      # A development release always replaces the previous one at the same
      # tag (release and tag are deleted, then created on this commit).
      - name: Create the GitHub release
        run: |
          if [ "$CHANNEL" = development ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
            for _ in 1 2 3 4 5 6; do git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || break; sleep 5; done
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            exit 0
          fi
          if [ "$CHANNEL" = production ]; then
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "VaultDock server $VERSION" --latest \
              --generate-notes --notes "Image: \`$IMAGE:latest\` (also \`$IMAGE:$VERSION\`), linux/amd64 and linux/arm64."
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "VaultDock server $VERSION (development)" --prerelease --latest=false \
              --notes "Development build of ${GITHUB_SHA::7}. Image: \`$IMAGE:dev\` (also \`$IMAGE:$VERSION\`). Replaced by the next development release."
          fi
